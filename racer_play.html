  #content { height:auto; min-height:700px; }

<script>
  (function () {
    function keepAlive() {
      fetch("https://game.pyongyangracer.com/api/heartbeat", {
        method: "POST",
        credentials: "include",
        cache: "no-store"
      }).catch(function () {});
    }
    keepAlive();
    setInterval(keepAlive, 10000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) keepAlive();
    });
  })();
</script>
