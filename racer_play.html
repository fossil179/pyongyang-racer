<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pyongyang Racer — Full Graphics</title>
<link rel="icon" type="image/jpg" href="racer_images/koryotours_top_icon.jpg" />
<link type="text/css" href="racer.css" rel="stylesheet" />
<style>
  #playbox { width:760px; height:600px; border:0; background:#000; }
  #setup { max-width:760px; margin:12px 0; padding:12px; background:#eef6ff; font-size:12px; line-height:1.5; }
  #setup code { background:#fff; padding:1px 4px; }
</style>
</head>
<body>
<div id="wrapper">
  <div id="header"><a href="racer.html"><img src="racer_images/racer_header.png" width="900" height="100" border="0" /></a></div>
  <div id="navigation"><strong>| <a href="racer.html" class="a4">PLAY THE GAME</a> | <a href="racer_play.html" class="a2">FULL GRAPHICS</a> | <a href="racer_about.html" class="a4">ABOUT</a> | <a href="racer_top10.html" class="a4">TOP 10</a> |</strong></div>
  <div id="leftcolumn"><img src="racer_images/border.jpg" width="43" height="600" /></div>
  <div id="content">
    <div id="setup">
      <strong>Full graphics version</strong> — real Adobe Flash Player streamed via noVNC.
      <strong>No sound</strong> in the browser (VNC limitation).
      For graphics and sound together, <a href="https://github.com/fossil179/pyongyang-racer/releases/latest">download the Mac app</a>.
    </div>
    <iframe id="playbox" title="Pyongyang Racer"></iframe>
    <script>
      // Set after running oracle/deploy.sh on your cloud VM
      var PLAY_SERVER = "";
      var PLAY_PASSWORD = "";
      var frame = document.getElementById("playbox");
      if (PLAY_SERVER && PLAY_PASSWORD) {
        frame.src = PLAY_SERVER.replace(/\/$/, "").replace(/^http:/, "https:")
          + "/vnc.html?autoconnect=1&resize=scale&password=" + encodeURIComponent(PLAY_PASSWORD);
      } else if (PLAY_SERVER) {
        frame.src = PLAY_SERVER.replace(/\/$/, "").replace(/^http:/, "https:")
          + "/vnc.html?autoconnect=1&resize=scale";
        document.getElementById("setup").innerHTML +=
          "<p>Enter the VNC password from <code>docker/.vnc-password</code> when prompted.</p>";
      } else {
        frame.style.display = "none";
        document.getElementById("setup").innerHTML =
          "<p><strong>Full graphics is not available right now.</strong> The play server is offline.</p>" +
          "<p>Use <a href=\"racer.html\">Play the game</a> (browser version with sound) or " +
          "<a href=\"https://github.com/fossil179/pyongyang-racer/releases/latest\">download the Mac app</a> (best quality).</p>";
      }
    </script>
  </div>
  <div id="rightcolumn"><img src="racer_images/border2.jpg" width="43" height="600" /></div>
  <div id="footer"><span class="a">| Pyongyang Racer — full Flash play via noVNC |</span></div>
</div>
</body>
</html>
