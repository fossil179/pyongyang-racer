services:
  pyongyang-racer:
    image: pyongyang-racer-stream:live
    build:
      context: ..
      dockerfile: docker/Dockerfile
    platform: linux/amd64
    profiles: ["manual"]
    expose:
      - "6080"
    env_file:
      - .env
    environment:
      - STREAM_USER=${STREAM_USER:-racer}
      - STREAM_PASSWORD=${STREAM_PASSWORD:?Set STREAM_PASSWORD in docker/.env}
    restart: unless-stopped
    shm_size: "128mb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128M,mode=1777

  queue-gateway:
    build:
      context: gateway
      dockerfile: Dockerfile
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - STREAM_USER=${STREAM_USER:-racer}
      - STREAM_PASSWORD=${STREAM_PASSWORD:?Set STREAM_PASSWORD in docker/.env}
      - TRUST_PROXY=true
      - EMBED_ORIGINS=${EMBED_ORIGINS:-https://pyongyangracer.com http://pyongyangracer.com}
      - MAX_ACTIVE_SECONDS=${MAX_ACTIVE_SECONDS:-900}
      - HEARTBEAT_TIMEOUT_SECONDS=${HEARTBEAT_TIMEOUT_SECONDS:-300}
      - WAITING_EXPIRY_SECONDS=${WAITING_EXPIRY_SECONDS:-300}
      - QUEUE_CAPACITY=${QUEUE_CAPACITY:-50}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-120}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - SESSION_IMAGE=pyongyang-racer-stream:live
      - SESSION_SLOTS=${SESSION_SLOTS:-8}
      - SESSION_PER_IP=${SESSION_PER_IP:-4}
      - SESSION_MEMORY_MB=${SESSION_MEMORY_MB:-768}
      - SESSION_SHM_SIZE_MB=${SESSION_SHM_SIZE_MB:-128}
      - SESSION_START_TIMEOUT_SECONDS=${SESSION_START_TIMEOUT_SECONDS:-120}
      - DOCKER_SOCKET=/var/run/docker.sock
      - TOP10_PATH=/data/top10.json
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gateway-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    depends_on:
      queue-gateway:
        condition: service_healthy
    environment:
      - STREAM_DOMAIN=${STREAM_DOMAIN:-game.pyongyangracer.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
