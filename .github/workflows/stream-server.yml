name: Validate stream server

on:
  workflow_dispatch:
  push:
    paths:
      - ".devcontainer/**"
      - "docker/**"
      - "oracle/**"
      - "PY Racer_0509/**"
      - "*.dat"
      - "*.txt"
      - "*.mp3"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test one-player queue gateway
        working-directory: docker/gateway
        run: |
          npm ci
          npm test
      - name: Validate Compose configuration
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose \
            -f docker/docker-compose.yml \
            -f .devcontainer/docker-compose.codespaces.yml \
            config --quiet
          bash -n .devcontainer/setup.sh .devcontainer/start.sh
      - name: Build Selkies Flash stream container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: pyongyang-racer-stream:test
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build queue gateway container
        run: docker build -t racer-queue-gateway:test docker/gateway
      - name: Smoke-test video and audio services
        run: |
          docker run -d --name racer-test --shm-size=1g --cap-drop=ALL \
            -e STREAM_USER=ci -e STREAM_PASSWORD=ci-test-password \
            -p 6080:6080 pyongyang-racer-stream:test
          ready=false
          for attempt in $(seq 1 120); do
            if curl -fsS -u ci:ci-test-password http://localhost:6080/ >/dev/null \
                && docker exec racer-test pactl list short sources | grep -q output.monitor \
                && docker exec racer-test pgrep -f /opt/flash/flashplayer >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' racer-test | grep -q true; then
              docker logs racer-test
              exit 1
            fi
            sleep 1
          done
          if [ "${ready}" != true ]; then
            docker exec racer-test sh -c 'cat /tmp/logs/*.log' || true
            exit 1
          fi
          curl -fsS -u ci:ci-test-password http://localhost:6080/ >/dev/null
          docker exec racer-test pactl list short sources | grep -q output.monitor
          docker exec racer-test pgrep -f /opt/flash/flashplayer
          docker exec racer-test /opt/selkies/app/usr/conda/bin/python \
            -c "import pixelflux"
      - name: Show logs on failure
        if: failure()
        run: |
          docker logs racer-test || true
          docker exec racer-test sh -c 'cat /tmp/logs/*.log' || true
      - name: Stop test container
        if: always()
        run: docker rm -f racer-test || true
